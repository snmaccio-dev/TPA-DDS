services:
  db:
    image: postgres:16
    container_name: tp-postgres-local
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD}
      POSTGRES_DB: keycloak
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init-databases.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  keycloak:
    build:
      context: .
      dockerfile: docker/keycloak.Dockerfile
    container_name: tp-keycloak-local
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: "8180"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "8180:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  donaciones:
    build:
      context: .
      dockerfile: docker/donaciones.Dockerfile
    container_name: tp-donaciones-local
    environment:
      DB_URL: jdbc:postgresql://db:5432/donatrack_donaciones
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DONACIONES_URL_BASE: http://donaciones:8080
      WEB_URL_BASE: http://localhost:8082
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: donatrack
      KEYCLOAK_CLIENT_ID: donaciones-backend
      KEYCLOAK_CLIENT_SECRET: ${DONACIONES_CLIENT_SECRET}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/donatrack
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  logistica:
    build:
      context: .
      dockerfile: docker/logistica.Dockerfile
    container_name: tp-logistica-local
    environment:
      DB_URL: jdbc:postgresql://db:5432/donatrack_logistica
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      LOGISTICA_URL_BASE: http://localhost:8081
      WEB_URL_BASE: http://localhost:8082
      DONACIONES_URL_BASE: http://donaciones:8080
      LOGISTICA_MODO: http
      LOGISTICA_PLANIFICADOR: simulado
      LOGISTICA_SEGURIDAD: on
      LOGISTICA_FOTOS_DIR: /app/fotos
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: donatrack
      KEYCLOAK_CLIENT_ID: logistica-backend
      KEYCLOAK_CLIENT_SECRET: ${LOGISTICA_CLIENT_SECRET}
      KEYCLOAK_ISSUER: http://localhost:8180/realms/donatrack
      KEYCLOAK_URL_PUBLICA: http://localhost:8180
      KEYCLOAK_WEB_CLIENT_ID: logistica-web
    ports:
      - "8081:8081"
    volumes:
      - logistica_fotos:/app/fotos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    container_name: tp-web-local
    environment:
      WEB_URL_BASE: http://localhost:8082
      DONACIONES_URL_BASE: http://donaciones:8080
      LOGISTICA_URL_BASE: http://logistica:8081
      LOGISTICA_URL_PUBLICA: http://localhost:8081
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: donatrack
      KEYCLOAK_CLIENT_ID: donatrack-web
      WEB_SEGURIDAD: "on"
    ports:
      - "8082:8082"
    depends_on:
      - donaciones
      - logistica
      - keycloak
    restart: unless-stopped

volumes:
  postgres_data:
  logistica_fotos:
