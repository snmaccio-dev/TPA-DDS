# Despliegue en Oracle Cloud (VM con IP publica).
# Agrega Caddy como proxy inverso con HTTPS automatico y reemplaza las URLs de localhost
# por las publicas. No se carga solo: hay que pasarlo explicitamente.
#
#   docker compose -f compose.yaml -f compose.oracle.yaml up -d --build
#
# Variables requeridas en .env (ver .env.example): DOMINIO, POSTGRES_PASSWORD,
# KEYCLOAK_ADMIN_PASSWORD, DONACIONES_CLIENT_SECRET, LOGISTICA_CLIENT_SECRET.

services:
  caddy:
    image: caddy:2
    container_name: tp-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO:?Falta DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks:
      default:
        # Web usa la misma URL de Keycloak para el navegador y para canjear el codigo.
        # Con este alias el canje va directo a Caddy por la red interna de Docker.
        aliases:
          - auth.${DOMINIO}

  keycloak:
    environment:
      KC_PROXY: edge
      KC_HOSTNAME: auth.${DOMINIO}
      KC_HOSTNAME_URL: https://auth.${DOMINIO}
      KC_HOSTNAME_ADMIN_URL: https://auth.${DOMINIO}
      KC_HOSTNAME_PORT: "-1"

  donaciones:
    environment:
      WEB_URL_BASE: https://web.${DOMINIO}
      KEYCLOAK_ISSUER: https://auth.${DOMINIO}/realms/donatrack

  logistica:
    environment:
      LOGISTICA_URL_BASE: https://logistica.${DOMINIO}
      WEB_URL_BASE: https://web.${DOMINIO}
      KEYCLOAK_ISSUER: https://auth.${DOMINIO}/realms/donatrack
      KEYCLOAK_URL_PUBLICA: https://auth.${DOMINIO}

  web:
    environment:
      WEB_URL_BASE: https://web.${DOMINIO}
      LOGISTICA_URL_PUBLICA: https://logistica.${DOMINIO}
      KEYCLOAK_URL: https://auth.${DOMINIO}
    depends_on:
      - caddy

volumes:
  caddy_data:
